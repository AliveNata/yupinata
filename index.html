<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://bmuglekfjylmubukthjc.supabase.co/storage/v1/object/public/images/favicon/1739222648570-heart_667477.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yupi & Nata</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Instant splash screen (pure CSS, no JS needed) -->
    <div id="splash" style="position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease">
      <style>
        @keyframes splash-draw{0%{stroke-dashoffset:65}100%{stroke-dashoffset:0}}
        @keyframes splash-fade{0%,100%{opacity:.2}50%{opacity:.5}}
        #splash-heart-path{animation:splash-draw 3s ease-in-out infinite alternate}
        #splash-text{animation:splash-fade 2s ease-in-out infinite}
      </style>
      <svg viewBox="0 0 24 24" width="120" height="120">
        <defs><linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF8FA3"/><stop offset="100%" stop-color="#87CEEB"/></linearGradient></defs>
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.6"/>
        <path id="splash-heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="url(#sg)" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="65" stroke-dashoffset="65"/>
      </svg>
      <p id="splash-text" style="font-family:'Playfair Display',serif;color:rgba(255,255,255,.3);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;margin-top:1.2rem">Loading...</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
